<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · TechET Pay</title>
<link rel="icon" href="/assets/logo.svg">
<link rel="manifest" href="/manifest-admin.webmanifest">
<meta name="theme-color" content="#0A1740">
<link rel="apple-touch-icon" href="/assets/icon-192.png">

<link rel="stylesheet" href="/assets/techet.css">
<style>
  body:before{top:60px;right:-120px}
  .shell{display:grid;grid-template-columns:248px minmax(0,1fr);gap:16px;padding:16px;max-width:1500px;margin:0 auto}
  .side{position:sticky;top:16px;height:calc(100vh - 32px);display:flex;flex-direction:column;padding:18px 14px;border-radius:32px}
  .side .brand{padding:2px 8px 18px;font-size:18px;white-space:nowrap;gap:8px}
  .side .brand img{width:34px;height:34px}
  .side .brand .tag{background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 55%),linear-gradient(160deg,var(--blue-600),var(--navy-900));color:#fff}
  .menu{display:flex;flex-direction:column;gap:6px}
  .menu small{font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--muted);padding:12px 12px 4px}
  .menu button{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid transparent;border-radius:18px;background:none;cursor:pointer;font-weight:700;color:var(--navy-800);text-align:left}
  .menu button svg{width:20px;height:20px;stroke:currentColor;flex:none}
  .menu button:hover{background:linear-gradient(145deg,rgba(255,255,255,.55),rgba(255,255,255,.2));border-color:rgba(255,255,255,.7)}
  .menu button.on{color:#fff;border-color:rgba(255,255,255,.35);box-shadow:0 14px 24px -12px rgba(10,23,64,.85),inset 0 1px 0 rgba(255,255,255,.45);
    background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),linear-gradient(160deg,var(--blue-600),var(--navy-900))}
  .side .push{flex:1}
  .feebox{border-radius:22px;padding:14px;color:#fff;font-size:13px;border:1px solid rgba(255,255,255,.3);
    background:linear-gradient(115deg,rgba(255,255,255,.24),rgba(255,255,255,0) 45%),radial-gradient(90% 120% at 100% 0%,rgba(95,168,245,.8),transparent 62%),linear-gradient(145deg,rgba(20,58,143,.96),rgba(10,23,64,.96))}
  .feebox b{display:block;font-size:22px;margin:2px 0}
  .who{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px;border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,.6),rgba(255,255,255,.2));border:1px solid rgba(255,255,255,.8)}
  .who .av{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;background:linear-gradient(160deg,var(--blue-500),var(--navy-800));flex:none}
  .who .em{flex:1;min-width:0;font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .who button{border:0;background:none;cursor:pointer;color:var(--muted);padding:4px}
  .main{min-width:0}
  .bar{display:flex;align-items:center;gap:12px;margin:4px 0 16px;flex-wrap:wrap}
  .bar h1{margin:0;font-size:28px;letter-spacing:-.5px} .bar .sub{color:var(--muted);font-size:13px}
  .bar .grow{flex:1;min-width:140px}
  .search{max-width:260px;padding:11px 16px;border-radius:99px}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .kpi{padding:18px;border-radius:26px;position:relative;overflow:hidden}
  .kpi .k{font-size:13px;color:var(--muted);font-weight:650;display:flex;justify-content:space-between;align-items:center}
  .kpi .k i{width:30px;height:30px;border-radius:11px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,var(--blue-500),var(--navy-800));border:1px solid rgba(255,255,255,.5)}
  .kpi .k i svg{width:16px;height:16px;stroke:#fff}
  .kpi .v{font-size:25px;font-weight:800;letter-spacing:-.6px;margin-top:8px;white-space:nowrap}
  .kpi .v small{font-size:13px;color:var(--muted);font-weight:650}
  .kpi .d{font-size:12.5px;color:var(--muted);margin-top:2px}
  .kpi.dark{color:#fff;border-color:rgba(255,255,255,.3);background:linear-gradient(115deg,rgba(255,255,255,.24),rgba(255,255,255,0) 45%),radial-gradient(90% 120% at 100% 0%,rgba(95,168,245,.8),transparent 62%),linear-gradient(145deg,rgba(20,58,143,.96),rgba(10,23,64,.96))}
  .kpi.dark .k,.kpi.dark .d,.kpi.dark .v small{color:var(--blue-200)}
  .kpi.dark .k i{background:rgba(255,255,255,.22)}
  .two{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px;margin-top:14px}
  .bars .br{margin:12px 0} .bars .bl{display:flex;justify-content:space-between;font-size:13px;font-weight:650;margin-bottom:5px}
  .bars .tr{height:10px;border-radius:9px;background:rgba(20,58,143,.14);overflow:hidden}
  .bars .tr b{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--blue-400),var(--navy-700))}
  .split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0;margin-top:14px;border-radius:34px;overflow:hidden;border:1px solid rgba(255,255,255,.18);box-shadow:var(--dark-shadow);
    background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 30%),linear-gradient(165deg,rgba(26,58,150,.82),rgba(8,20,64,.94));color:#fff;padding:14px;gap:14px}
  .split h3{color:#fff;margin:6px 6px 8px}
  .split .item{padding:11px 8px;border-radius:18px;border-top:0;transition:background .15s}
  .split .item:hover{background:rgba(255,255,255,.08)}
  .detail{border-radius:26px;padding:18px;border:1px solid rgba(255,255,255,.22);
    background:linear-gradient(115deg,rgba(255,255,255,.2),rgba(255,255,255,0) 40%),radial-gradient(80% 90% at 100% 0%,rgba(95,168,245,.55),transparent 65%),linear-gradient(145deg,rgba(47,134,224,.55),rgba(31,111,208,.35));
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
  .detail .amt{font-size:30px;font-weight:800;letter-spacing:-.8px;margin:2px 0 12px}
  .detail .dk{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.16);font-size:13.5px}
  .detail .dk span:first-child{color:var(--blue-200)} .detail .dk span:last-child{font-weight:650;text-align:right;word-break:break-all}
  .tbl{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:14px}
  .tbl th{font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 12px;font-weight:800;white-space:nowrap}
  .tbl td{padding:12px;background:linear-gradient(145deg,rgba(255,255,255,.55),rgba(255,255,255,.22));vertical-align:middle}
  .tbl td:first-child{border-radius:16px 0 0 16px;border-left:1px solid rgba(255,255,255,.8)}
  .tbl td:last-child{border-radius:0 16px 16px 0;border-right:1px solid rgba(255,255,255,.8)}
  .tbl td{border-top:1px solid rgba(255,255,255,.8);border-bottom:1px solid rgba(255,255,255,.6)}
  .tbl .r{text-align:right} .tbl b{font-weight:750} .tbl .sm{font-size:12px;color:var(--muted)}
  .scroll{overflow-x:auto}
  .pill.suspended{background:rgba(253,226,227,.92);color:#B4232A}
  .pill.active{background:rgba(216,245,234,.92);color:#0B7A53}
  .mini{padding:7px 14px;font-size:13px}
  .mini.danger{background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 55%),linear-gradient(160deg,#E5484D,#8A1C22)}
  .login{max-width:420px;margin:9vh auto 0;padding:0 16px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:12px 20px;border-radius:99px;color:#fff;font-weight:650;z-index:60;
    background:linear-gradient(160deg,var(--blue-600),var(--navy-900));box-shadow:0 18px 30px -12px rgba(10,23,64,.8)}
  @media(max-width:1100px){.kpis{grid-template-columns:1fr 1fr}.two,.split{grid-template-columns:1fr}}
  @media(max-width:860px){
    .shell{grid-template-columns:1fr;padding:10px}
    .side{position:static;height:auto;flex-direction:row;align-items:center;gap:8px;padding:10px;border-radius:26px;overflow-x:auto}
    .side .brand{padding:0 6px 0 4px} .side .brand span,.menu small,.feebox,.who .em,.side .push{display:none}
    .menu{flex-direction:row} .menu button{padding:10px 14px;white-space:nowrap}
    .who{margin:0;padding:6px}
  }
  @media(max-width:520px){.kpis{grid-template-columns:1fr}.menu button span{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $ = (s, el=document) => el.querySelector(s);
const SK = 'tp_admin';
let token = null, email = '', page = 'overview', data = {}, q = '', fstatus = '', sel = null, timer = null;
try { token = sessionStorage.getItem(SK); email = sessionStorage.getItem(SK+'e') || ''; } catch(e){}

function el(tag, props={}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(props)){
    if (k==='class') e.className=v; else if (k.startsWith('on')) e.addEventListener(k.slice(2),v); else if (v===true) e.setAttribute(k,''); else if (v!==false && v!=null) e.setAttribute(k,v);
  }
  for (const k of kids.flat()) if (k!=null) e.append(k);
  return e;
}
const ICON = {
  grid:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 010 6.8M18 14.8c1.9.6 3.2 2.3 3.5 5.2"/>',
  card:'<rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M6.5 15h4"/>',
  send:'<path d="M21 3L3 10.5l7 3 3 7L21 3z"/><path d="M10 13.5L21 3"/>',
  hook:'<path d="M9 6a3 3 0 116 0c0 1.5-1 2.3-2 3.5S12 12 12 14"/><path d="M12 14c0 3-2 5-5 5M12 14c0 2.5 2 5 5 5a3 3 0 100-6"/>',
  shield:'<path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
  out:'<path d="M9 4H5a2 2 0 00-2 2v12a2 2 0 002 2h4M16 8l4 4-4 4M20 12H9"/>',
  coin:'<circle cx="12" cy="12" r="9"/><path d="M14.5 9a2.8 2.8 0 00-5 1.6c0 3 5 1.7 5 4.6a2.8 2.8 0 01-5 1.6M12 6.5v1.6M12 15.9v1.6"/>',
  chk:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/>'
};
const svg = n => { const s = document.createElementNS('http://www.w3.org/2000/svg','svg'); s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('fill','none'); s.setAttribute('stroke-width','1.9'); s.setAttribute('stroke-linecap','round'); s.setAttribute('stroke-linejoin','round'); s.innerHTML = ICON[n]; return s; };
function money(v){ const [w,d='00']=String(v).split('.'); const neg=w.startsWith('-'); return (neg?'-':'')+Number(w.replace('-','')).toLocaleString('en-US')+'.'+d; }
function when(iso){ try{ return new Date(iso).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){ return iso; } }
function toast(t){ const x=el('div',{class:'toast'},t); document.body.append(x); setTimeout(()=>x.remove(),2200); }
async function api(path, body){
  const opt = {headers:{}};
  if (token) opt.headers.Authorization = 'Bearer '+token;
  if (body !== undefined){ opt.method='POST'; opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(body); }
  const r = await fetch('/admin/api'+path, opt);
  const j = await r.json().catch(()=>({message:'Network error'}));
  if (r.status===401 && token){ signOut(true); throw new Error(j.message); }
  if (!r.ok) throw new Error(j.message || 'Something went wrong');
  return j.data;
}
function signOut(silent){
  token=null; try{sessionStorage.removeItem(SK);}catch(e){}
  clearInterval(timer); render();
  if(!silent) api('/logout',{}).catch(()=>{});
}

/* ---------- login ---------- */
function loginView(msg){
  const err = el('div',{class:'msg bad',role:'alert'}, msg||'');
  const f = el('form',{onsubmit:async e=>{
    e.preventDefault(); const v=Object.fromEntries(new FormData(e.target)); b.disabled=true; err.textContent='';
    try{ const d = await api('/login', v); token=d.token; email=d.email; try{sessionStorage.setItem(SK,token);sessionStorage.setItem(SK+'e',email);}catch(x){} page='overview'; load(); }
    catch(x){ err.textContent=x.message; b.disabled=false; }
  }},
    el('label',{for:'e'},'Admin email'), el('input',{id:'e',name:'email',type:'email',autocomplete:'username',required:true}),
    el('label',{for:'p'},'Password'), el('input',{id:'p',name:'password',type:'password',autocomplete:'current-password',required:true}),
    err);
  const b = el('button',{class:'btn block',type:'submit'},'Sign in to admin');
  f.append(b);
  $('#app').replaceChildren(el('div',{class:'login stack'},
    el('div',{class:'brand'},el('img',{src:'/assets/logo.svg',alt:''}),'TechET Pay ',el('span',{class:'tag'},'ADMIN')),
    el('div',{class:'glass'}, el('h3',{},'Gateway control panel'), el('p',{class:'dim'},'Only the gateway owner can sign in here.'), f)));
}

/* ---------- shell ---------- */
const NAV = [['overview','Overview','grid'],['merchants','Merchants','users'],['payments','Payments','card'],['payouts','Payouts','send'],['webhooks','Webhooks','hook'],['system','System','shield']];
const TITLES = {overview:['Overview','Everything happening across your gateway'],merchants:['Merchants','Businesses using TechET Pay'],payments:['Payments','Every payment across all merchants'],
  payouts:['Payouts','Money sent out to bank and wallet accounts'],webhooks:['Webhooks','Delivery log for merchant callbacks'],system:['System','Ledger integrity and configuration']};

function shell(content){
  const o = data.overview;
  const menu = el('nav',{class:'menu'}, el('small',{},'MENU'),
    NAV.map(([id,label,ic])=>el('button',{class:id===page?'on':'',onclick:()=>{page=id;sel=null;q='';fstatus='';load();}}, svg(ic), el('span',{},label))));
  const side = el('aside',{class:'glass side'},
    el('div',{class:'brand'},el('img',{src:'/assets/logo.svg',alt:''}),el('span',{},'TechET Pay'),el('span',{class:'tag'},'ADMIN')),
    menu, el('div',{class:'push'}),
    o ? el('div',{class:'feebox'}, 'Platform fee', el('b',{}, o.fee_percent+'%'), 'Payout fee '+money(o.payout_fee)+' ETB') : null,
    el('div',{class:'who'}, el('div',{class:'av'}, (email[0]||'A').toUpperCase()), el('div',{class:'em'}, email),
      el('button',{title:'Sign out','aria-label':'Sign out',onclick:()=>signOut()}, (()=>{const s=svg('out'); s.style.cssText='width:20px;height:20px;stroke:currentColor'; return s;})())));
  const [t,sub] = TITLES[page];
  const bar = el('div',{class:'bar'}, el('div',{class:'grow'}, el('h1',{},t), el('div',{class:'sub'},sub)),
    (page==='payments'||page==='merchants') ? el('input',{class:'search',placeholder:'Search…',value:q,oninput:e=>{q=e.target.value;clearTimeout(window._st);window._st=setTimeout(()=>{ if(page==='payments') load(true); else render(true); },250);}}) : null,
    el('button',{class:'btn light mini',onclick:()=>load()},'Refresh'));
  $('#app').replaceChildren(el('div',{class:'shell'}, side, el('main',{class:'main'}, bar, content)));
  const s=$('.search'); if(s && window._focusSearch){ s.focus(); s.setSelectionRange(q.length,q.length); }
}

/* ---------- shared bits ---------- */
function kpi(label, value, sub, ic, dark, unit){
  return el('div',{class:'glass kpi'+(dark?' dark':'')}, el('div',{class:'k'},label, el('i',{},svg(ic))),
    el('div',{class:'v'}, value, unit?el('small',{},' '+unit):null), sub?el('div',{class:'d'},sub):null);
}
function lineChart(series){
  const W=640,H=190,P=26; const vals=series.map(p=>parseFloat(p.volume)||0); const max=Math.max(...vals,1);
  const x=i=>P+i*(W-2*P)/(vals.length-1), y=v=>H-24-(v/max)*(H-54);
  const pts=vals.map((v,i)=>[x(i),y(v)]); let d='M'+pts[0][0]+','+pts[0][1];
  for(let i=0;i<pts.length-1;i++){ const a=pts[i],b=pts[i+1],cx=(a[0]+b[0])/2; const lo=Math.min(a[1],b[1]),hi=Math.max(a[1],b[1]);
    d+=' C'+cx+','+Math.min(Math.max(a[1],lo),hi)+' '+cx+','+Math.min(Math.max(b[1],lo),hi)+' '+b[0]+','+b[1]; }
  const ns='http://www.w3.org/2000/svg'; const s=document.createElementNS(ns,'svg'); s.setAttribute('viewBox',`0 0 ${W} ${H}`); s.setAttribute('class','chart'); s.style.height='200px';
  s.innerHTML=`<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F86E0" stop-opacity=".5"/><stop offset="1" stop-color="#2F86E0" stop-opacity="0"/></linearGradient>
  <linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#5FA8F5"/><stop offset="1" stop-color="#143A8F"/></linearGradient></defs>
  <path d="${d} L${x(vals.length-1)},${H-24} L${x(0)},${H-24} Z" fill="url(#ag)"/><path d="${d}" fill="none" stroke="url(#lg)" stroke-width="3.5" stroke-linecap="round"/>`+
  series.map((p,i)=> (i%3===0||i===series.length-1)?`<text class="axis" x="${x(i)}" y="${H-6}" text-anchor="middle">${p.date.slice(5)}</text>`:'').join('')+
  pts.map((p,i)=>vals[i]>0?`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="#fff" stroke="#143A8F" stroke-width="2.5"/>`:'').join('');
  return s;
}
const pill = st => el('span',{class:'pill '+st}, st);
const MN = {telebirr:'Telebirr',cbebirr:'CBE Birr',mpesa:'M-Pesa',amole:'Amole',card:'Card'};
function empty(t){ return el('div',{class:'empty'},t); }

/* ---------- pages ---------- */
function vOverview(){
  const o=data.overview; if(!o) return empty('Loading…');
  const total = o.methods.reduce((s,m)=>s+parseFloat(m.volume),0)||1;
  const latest = (data.txs||[]).slice(0,7);
  if(!sel && latest.length) sel = latest[0].tx_ref;
  const cur = latest.find(t=>t.tx_ref===sel) || latest[0];
  return el('div',{},
    el('div',{class:'kpis'},
      kpi('Total volume', money(o.gross_volume), o.successful+' successful payments','coin',true,'ETB'),
      kpi('Fees earned', money(o.fees_earned), 'Your platform revenue','chk',false,'ETB'),
      kpi('Merchants', String(o.merchants), o.suspended+' suspended','users'),
      kpi('Held for merchants', money(o.merchant_balances), 'Paid out '+money(o.paid_out)+' ETB','card',false,'ETB')),
    el('div',{class:'two'},
      el('div',{class:'glass'}, el('div',{class:'row spread'},el('h3',{style:'margin:0'},'Volume, last 14 days'), el('span',{class:'chip light'}, o.successful+' ok · '+o.failed+' failed · '+o.pending+' pending')), lineChart(o.series)),
      el('div',{class:'glass bars'}, el('h3',{},'Payment methods'),
        o.methods.length ? o.methods.map(m=>el('div',{class:'br'}, el('div',{class:'bl'},el('span',{},MN[m.method]||m.method),el('span',{},money(m.volume))), el('div',{class:'tr'},el('b',{style:'width:'+Math.max(4,parseFloat(m.volume)/total*100)+'%'})))) : empty('No payments yet'),
        el('div',{class:'kv'},el('span',{},'Payouts'),el('span',{},o.payouts_ok+' sent · '+o.payouts_pending+' pending · '+o.payouts_failed+' failed')))),
    el('div',{class:'split'},
      el('div',{}, el('h3',{},'Latest payments'),
        latest.length ? latest.map(t=>el('button',{class:'item',style:t.tx_ref===(cur&&cur.tx_ref)?'background:linear-gradient(145deg,rgba(47,134,224,.85),rgba(31,111,208,.55));border-radius:18px':'',onclick:()=>{sel=t.tx_ref;render();}},
          el('div',{class:'ic'},(MN[t.payment_method]||'—').slice(0,2).toUpperCase()),
          el('div',{class:'mid'},el('div',{class:'t'},t.merchant),el('div',{class:'s'},t.email||t.tx_ref)),
          el('div',{class:'end'},el('div',{class:'amt'},money(t.amount)),pill(t.status)))) : empty('Payments will appear here')),
      cur ? el('div',{class:'detail'}, el('div',{class:'row spread'},el('span',{class:'small',style:'color:var(--blue-200)'},'Payment details'),pill(cur.status)),
        el('div',{class:'amt'},money(cur.amount)+' ',el('small',{style:'font-size:14px;color:var(--blue-200)'},cur.currency)),
        [['Merchant',cur.merchant],['Payer',cur.email||'—'],['Method',(MN[cur.payment_method]||'—')+' '+(cur.account||'')],['Fee',money(cur.fee)],['Merchant gets',money(cur.net_amount)],['Reference',cur.tx_ref],['Created',when(cur.created_at)]].map(([k,v])=>el('div',{class:'dk'},el('span',{},k),el('span',{},v))))
        : el('div',{class:'detail'},empty('Select a payment')))
  );
}
function vMerchants(){
  const list=(data.merchants||[]).filter(m=>!q||(m.name+' '+m.email).toLowerCase().includes(q.toLowerCase()));
  if(!list.length) return el('div',{class:'glass'},empty('No merchants found'));
  return el('div',{class:'scroll'}, el('table',{class:'tbl'},
    el('thead',{},el('tr',{},['Business','Joined','Payments','Volume','Balance','Status',''].map((h,i)=>el('th',{class:i>=2&&i<=4?'r':''},h)))),
    el('tbody',{}, list.map(m=>el('tr',{},
      el('td',{},el('b',{},m.name),el('div',{class:'sm'},m.email)),
      el('td',{},when(m.created_at)),
      el('td',{class:'r'},m.payments), el('td',{class:'r'},el('b',{},money(m.volume))), el('td',{class:'r'},money(m.balance)),
      el('td',{},pill(m.suspended?'suspended':'active')),
      el('td',{class:'r'},el('button',{class:'btn mini '+(m.suspended?'light':'danger'),onclick:async()=>{
        if(!m.suspended && !confirm('Suspend '+m.name+'? They will be signed out and their API key stops working.')) return;
        try{ await api('/merchants/'+m.id+'/suspend',{suspended:!m.suspended}); toast(m.suspended?'Merchant reactivated':'Merchant suspended'); load(); }catch(x){ toast(x.message); }
      }}, m.suspended?'Reactivate':'Suspend'))))))); 
}
function vPayments(){
  const bar = el('div',{class:'seg'}, [['','All'],['success','Successful'],['pending','Pending'],['failed','Failed']].map(([v,l])=>el('button',{class:fstatus===v?'on':'',onclick:()=>{fstatus=v;load(true);}},l)));
  const list=data.txs||[];
  return el('div',{}, bar, list.length ? el('div',{class:'scroll'},el('table',{class:'tbl'},
    el('thead',{},el('tr',{},['Merchant','Reference','Method','Amount','Fee','Status','Date'].map((h,i)=>el('th',{class:i===3||i===4?'r':''},h)))),
    el('tbody',{},list.map(t=>el('tr',{},
      el('td',{},el('b',{},t.merchant),el('div',{class:'sm'},t.email||'')), el('td',{},t.tx_ref), el('td',{},(MN[t.payment_method]||'—')+' '+(t.account||'')),
      el('td',{class:'r'},el('b',{},money(t.amount))), el('td',{class:'r'},money(t.fee)), el('td',{},pill(t.status)), el('td',{},when(t.created_at))))))) : el('div',{class:'glass'},empty('No payments match')));
}
function vPayouts(){
  const list=data.transfers||[];
  return list.length ? el('div',{class:'scroll'},el('table',{class:'tbl'},
    el('thead',{},el('tr',{},['Merchant','Recipient','Bank','Amount','Fee','Status','Date'].map((h,i)=>el('th',{class:i===3||i===4?'r':''},h)))),
    el('tbody',{},list.map(t=>el('tr',{},
      el('td',{},el('b',{},t.merchant),el('div',{class:'sm'},t.reference)), el('td',{},t.account_name,el('div',{class:'sm'},t.account_number)), el('td',{},t.bank_code),
      el('td',{class:'r'},el('b',{},money(t.amount))), el('td',{class:'r'},money(t.fee)),
      el('td',{},pill(t.status),t.failure_reason?el('div',{class:'sm'},t.failure_reason):null), el('td',{},when(t.created_at))))))) : el('div',{class:'glass'},empty('No payouts yet'));
}
function vWebhooks(){
  const list=data.deliveries||[];
  return list.length ? el('div',{class:'scroll'},el('table',{class:'tbl'},
    el('thead',{},el('tr',{},['Merchant','Event','Status','Attempts','Last result','Date'].map(h=>el('th',{},h)))),
    el('tbody',{},list.map(d=>el('tr',{},el('td',{},el('b',{},d.merchant)),el('td',{},d.event),el('td',{},pill(d.status)),el('td',{},d.attempts),
      el('td',{},d.last_error||(d.last_code?('HTTP '+d.last_code):'—')),el('td',{},when(d.created_at))))))) : el('div',{class:'glass'},empty('No webhook deliveries yet'));
}
function vSystem(){
  const l=data.ledger, o=data.overview||{};
  return el('div',{class:'grid cols-2'},
    el('div',{class:'glass'},el('h3',{},'Ledger integrity'), l?[
      el('div',{class:'row',style:'margin-bottom:10px'},pill(l.balanced?'success':'failed'),el('b',{},l.balanced?'Books balance':'MISMATCH, investigate')),
      el('div',{class:'kv'},el('span',{},'Entries'),el('span',{},l.entries)),el('div',{class:'kv'},el('span',{},'Total debits'),el('span',{},money(l.total_debits))),
      el('div',{class:'kv'},el('span',{},'Total credits'),el('span',{},money(l.total_credits)))]:empty('Loading…')),
    el('div',{class:'glass'},el('h3',{},'Configuration'),
      el('div',{class:'kv'},el('span',{},'Platform fee'),el('span',{},(o.fee_percent??'')+'%')),
      el('div',{class:'kv'},el('span',{},'Payout fee'),el('span',{},money(o.payout_fee||'0.00')+' ETB')),
      el('div',{class:'kv'},el('span',{},'Mode'),el('span',{},'Sandbox (simulated providers)')),
      el('p',{class:'small muted'},'Fees, the admin login and storage are set with environment variables on your host (TECHET_FEE_BPS, TECHET_PAYOUT_FEE, TECHET_ADMIN_EMAIL, TECHET_ADMIN_PASSWORD).')));
}
const VIEWS={overview:vOverview,merchants:vMerchants,payments:vPayments,payouts:vPayouts,webhooks:vWebhooks,system:vSystem};

function render(keepFocus){ window._focusSearch=!!keepFocus; if(!token) return loginView(); shell(VIEWS[page]()); }
async function load(quiet){
  if(!token) return render();
  try{
    if(page==='overview'){ [data.overview,data.txs]=await Promise.all([api('/overview'),api('/transactions')]); }
    else if(page==='merchants') data.merchants=await api('/merchants');
    else if(page==='payments') data.txs=await api('/transactions?status='+encodeURIComponent(fstatus)+'&q='+encodeURIComponent(q));
    else if(page==='payouts') data.transfers=await api('/transfers');
    else if(page==='webhooks') data.deliveries=await api('/deliveries');
    else if(page==='system'){ [data.ledger,data.overview]=await Promise.all([api('/ledger-check'),api('/overview')]); }
    if(!data.overview && page!=='overview') data.overview=await api('/overview');
    render(quiet===true);
  }catch(x){ if(token) toast(x.message); }
}
render(); if(token){ load(); }
timer=setInterval(()=>{ if(token && !document.hidden && page==='overview') load(true); },20000);
</script>
